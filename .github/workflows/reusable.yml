name: Reusable Workflow
on:
  workflow_call:
    inputs:
      arguments:
        description: 'Client JSON Payload'
        type: string
        default: '{}'
        required: false
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  checkout:
    continue-on-error: true 
    runs-on: ubuntu-latest
    steps:
      - name: Use passed secret
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          echo "Secret length: ${#AWS_KEY}" > out.txt
          echo "Status: Success" >> out.txt
          
      - name: Upload file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: out-file
          path: out.txt
